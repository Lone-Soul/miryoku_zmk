name: 'Build tako nice_nano_v2 nice_view'
on: workflow_dispatch
jobs:
  build:
    uses: ./.github/workflows/main.yml
    secrets: inherit
    with:
      board: '["nice_nano_v2"]'
      shield: '["nice_view_adapter nice_view tako_left","nice_view_adapter nice_view tako_right"]'
      # shield: '["nice_view_adapter nice_epaper tako_left","nice_view_adapter nice_epaper tako_right"]'
      kconfig: '["CONFIG_ZMK_BLE=y\nCONFIG_ZMK_DISPLAY=y\nCONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y\nCONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y\nCONFIG_ZMK_EXT_POWER=n\nCONFIG_ZMK_POINTING=y"]'
      # kconfig: '["CONFIG_ZMK_BLE=y\nCONFIG_ZMK_DISPLAY=y\nCONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y\nCONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y\nCONFIG_ZMK_EXT_POWER=n\nCONFIG_ZMK_POINTING=y\nCONFIG_NICE_OLED_ON=n\nCONFIG_NICE_EPAPER_ON=y\nCONFIG_NICE_CUSTOM_ON=n\nCONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y\nCONFIG_NICE_OLED_WIDGET_RAW_HID=y\nCONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL=y"]'
      modules: '["Lone-Soul/tako-config/main:config/tako_drivers"]'
      branches: '["zmkfirmware/zmk/v0.3.0"]'
